<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operator HMI - MES</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; margin: 0; padding: 20px; font-size: 18px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
h1 { font-size: 2.8rem; margin: 0; color: #60a5fa; }
.status { font-size: 2rem; padding: 12px 24px; border-radius: 12px; background: #1f2937; }
.big { font-size: 3.5rem; font-weight: 700; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #1f2937; border-radius: 16px; padding: 24px; border: 2px solid #374151; }
button { 
  font-size: 1.8rem; padding: 28px 20px; margin: 8px; border: none; border-radius: 16px; 
  background: #2563eb; color: white; width: calc(50% - 16px); min-height: 100px; 
  cursor: pointer; touch-action: manipulation;
}
button.danger { background: #dc2626; }
button.success { background: #16a34a; }
button.warn { background: #d97706; }
button:active { transform: scale(0.97); }
select, input { font-size: 1.4rem; padding: 16px; border-radius: 12px; border: 2px solid #4b5563; background: #111827; color: white; width: 100%; margin: 8px 0; }
.order-info { font-size: 1.6rem; line-height: 1.8; }
#message { margin-top: 20px; padding: 16px; background: #065f46; border-radius: 12px; font-size: 1.3rem; }
</style>
</head>
<body>
<div class="header">
  <h1>OPERATOR HMI</h1>
  <div class="status" id="status">Loading...</div>
</div>

<div class="grid">
  <div class="card">
    <div class="order-info" id="orderInfo">No active order</div>
    <div style="margin-top:16px;">
      <label>Machine</label>
      <select id="machineSelect"></select>
    </div>
  </div>
  <div class="card">
    <h2 style="margin-top:0;">Actions</h2>
    <button class="success" onclick="doAction('start')">START</button>
    <button class="warn" onclick="doAction('pause')">PAUSE</button>
    <button class="success" onclick="doAction('resume')">RESUME</button>
    <button class="success" onclick="doAction('complete')">COMPLETE</button>
    <button class="danger" onclick="showScrap()">SCRAP</button>
  </div>
</div>

<div class="card" style="margin-top:20px;">
  <h2>Record Downtime / Material / Quality</h2>
  <div class="grid">
    <div>
      <label>Downtime Reason</label>
      <select id="reasonSelect"></select>
      <button onclick="recordDowntime()">LOG DOWNTIME</button>
    </div>
    <div>
      <label>Material Lot</label>
      <select id="lotSelect"></select>
      <input id="serialInput" placeholder="Serial or Batch ID" style="font-size:1.4rem;">
      <button onclick="recordGenealogy()">CONSUME MATERIAL</button>
    </div>
  </div>
  <div style="margin-top:16px;">
    <label>Quality Check</label>
    <select id="checkResult">
      <option value="pass">PASS</option>
      <option value="fail">FAIL</option>
    </select>
    <input id="checkType" placeholder="Check type (e.g. cavity)" value="cavity">
    <button onclick="recordQuality()">RECORD CHECK</button>
    <button class="warn" onclick="waive()">WAIVE FAIL</button>
  </div>
</div>

<div id="message"></div>

<script>
let currentOrder = null;
let reasons = [];
let machines = [];
let lots = [];

async function load() {
  const orders = await (await fetch('/api/orders')).json();
  currentOrder = orders.find(o => o.status !== 'complete') || orders[0];
  machines = await (await fetch('/api/machines')).json();
  reasons = await (await fetch('/api/reasons')).json();
  lots = await (await fetch('/api/lots')).json();
  
  const ms = document.getElementById('machineSelect');
  ms.innerHTML = machines.map(m => `<option value="${m.id}">${m.name} (${m.ideal_rate}/hr)</option>`).join('');
  const rs = document.getElementById('reasonSelect');
  rs.innerHTML = reasons.map(r => `<option value="${r.id}">${r.code} - ${r.description}</option>`).join('');
  const ls = document.getElementById('lotSelect');
  ls.innerHTML = lots.map(l => `<option value="${l.id}">${l.lot_number} (${l.material_code})</option>`).join('');
  
  render();
}

function render() {
  if (!currentOrder) return;
  document.getElementById('status').textContent = currentOrder.status.toUpperCase();
  document.getElementById('status').style.background = 
    currentOrder.status === 'running' ? '#16a34a' : 
    currentOrder.status === 'held' ? '#d97706' : 
    currentOrder.status === 'complete' ? '#6b7280' : '#2563eb';
  document.getElementById('orderInfo').innerHTML = `
    <div class="big">${currentOrder.order_number}</div>
    Product: ${currentOrder.product_code}<br>
    Target: ${currentOrder.quantity_ordered} units<br>
    Good: ${currentOrder.quantity_good || 0} | Scrap: ${currentOrder.quantity_scrap || 0}<br>
    Rate: ${currentOrder.target_rate}/hr<br>
    Recipe: ${currentOrder.recipe || 'Standard'}
  `;
}

async function doAction(action) {
  if (!currentOrder) return;
  const body = { action, operator_id: 2, machine_id: document.getElementById('machineSelect').value };
  if (action === 'pause') body.reason_id = document.getElementById('reasonSelect').value;
  if (action === 'complete') {
    body.quantity_good = prompt('Good count?', currentOrder.quantity_good || 0) || 0;
    body.quantity_scrap = prompt('Scrap count?', currentOrder.quantity_scrap || 0) || 0;
  }
  const res = await fetch(`/api/orders/${currentOrder.id}/action`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json();
  showMsg(data.error || `${action.toUpperCase()} OK`);
  await load();
}

function showScrap() {
  const qty = prompt('Scrap quantity?', '1');
  const reason = prompt('Scrap reason code?', 'JAM');
  if (qty) doAction('scrap'); // simplified; in real would pass qty
  showMsg('Scrap recorded (demo)');
}

async function recordDowntime() {
  const body = {
    machine_id: document.getElementById('machineSelect').value,
    order_id: currentOrder?.id,
    reason_id: document.getElementById('reasonSelect').value,
    start_time: new Date().toISOString(),
    end_time: new Date(Date.now() + 10*60000).toISOString(), // demo 10 min
    operator_id: 2
  };
  await fetch('/api/downtime', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  showMsg('Downtime logged');
}

async function recordGenealogy() {
  const serial = document.getElementById('serialInput').value || `BATCH-${currentOrder?.order_number || 'DEMO'}`;
  const body = {
    serial_or_batch: serial,
    order_id: currentOrder?.id,
    machine_id: document.getElementById('machineSelect').value,
    material_lot_id: document.getElementById('lotSelect').value,
    quantity_used: 10,
    operator_id: 2
  };
  await fetch('/api/genealogy', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  showMsg(`Genealogy recorded for ${serial}`);
}

async function recordQuality() {
  const serial = document.getElementById('serialInput').value || `SN-${Date.now()}`;
  const body = {
    serial_or_batch: serial,
    order_id: currentOrder?.id,
    check_type: document.getElementById('checkType').value,
    result: document.getElementById('checkResult').value,
    notes: 'Operator recorded'
  };
  await fetch('/api/quality', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  showMsg(`Quality ${body.result} for ${serial}`);
}

async function waive() {
  const serial = document.getElementById('serialInput').value;
  if (!serial) return showMsg('Enter serial first');
  // For demo, post a fail then waive
  await recordQuality(); // ensure exists
  // In real would update specific check; simplified
  showMsg('Waiver recorded by QE (demo - see recall)');
}

function showMsg(m) {
  document.getElementById('message').textContent = m;
  setTimeout(() => document.getElementById('message').textContent = '', 4000);
}

load();
</script>
</body>
</html>
